services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${SID_TARGET_DATABASE:-sid_retail}
      MARIADB_USER: ${SID_TARGET_USER:-sid_migrator}
      MARIADB_PASSWORD: ${SID_TARGET_PASSWORD:?set SID_TARGET_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${SID_TARGET_ROOT_PASSWORD:?set SID_TARGET_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${SID_TARGET_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-flush-log-at-trx-commit=1
    volumes:
      - sid-retail-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sid-retail-mariadb:

